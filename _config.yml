remote_theme: "mmistakes/minimal-mistakes@4.24.0"

minimal_mistakes_skin: dark

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

author:
  name: Mauro Sunda
  avatar: "/assets/images/profile.jpg"
  bio: "Cybersecurity student at Deakin University (WAM 79 · TryHackMe Top 1%). Focused on DFIR, SOC analysis, and AI security."
  location: "Melbourne, Australia"
  email: "MauroSunda@protonmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Asm0d3us5"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mauro-sunda-29aa02263"
    - label: "TryHackMe"
      icon: "fas fa-fw fa-flag"
      url: "https://tryhackme.com/p/Asm0d3us5"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Nav links shown in masthead
# Minimal Mistakes reads this as the primary navigation
masthead_title: "Mauro Sunda"   # visible brand in nav bar

# header_pages drives the nav on splash/default layouts
header_pages:
  - index.md
  - projects.md
  - blog.md
  - about.md

